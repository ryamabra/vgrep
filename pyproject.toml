[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vgrep"
version = "0.1.0.dev0"
description = "Semantic grep for your local files. Search photos and documents by meaning, entirely on-device."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ryan Abraham" }]
keywords = ["semantic-search", "cli", "embeddings", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "pillow-heif>=0.15",       # iPhone HEIC support
    "torch>=2.1",
    "transformers>=4.40",
    "rich>=13.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
vgrep = "vgrep.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/vgrep"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
